stages:
  - fmt
  - clippy
  - test
  - package
  - release

default:
  tags:
    - rust
    - omaclipsync
  cache:
    key: omaclipsync-rust-x86_64
    paths:
      - target/

variables:
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

fmt:
  stage: fmt
  script:
    - cargo fmt --manifest-path core/Cargo.toml --all -- --check

clippy:
  stage: clippy
  script:
    - cargo clippy --manifest-path core/Cargo.toml --locked --all-targets -- -D warnings

test:
  stage: test
  script:
    - cargo test --manifest-path core/Cargo.toml --locked
    - cargo build --manifest-path core/Cargo.toml --locked --bin syncclipd
    - python3 core/tests/mocked_e2e.py "$CARGO_TARGET_DIR/debug/syncclipd"
    - python3 core/tests/mocked_e2e.py "$CARGO_TARGET_DIR/debug/syncclipd" --blacklist
    - python3 core/tests/auth_recovery.py "$CARGO_TARGET_DIR/debug/syncclipd"
    - python3 core/tests/signalr_e2e.py "$CI_PROJECT_DIR/bin/syncclipd"
    - python3 core/tests/offline_recovery.py "$CARGO_TARGET_DIR/debug/syncclipd"
    - gjs tests/settings.gjs Settings.js

package:
  stage: package
  script:
    - ./scripts/package.sh
  artifacts:
    paths:
      - dist/syncclipd-linux-x86_64
      - dist/omaclipsync-plugin-*.tar.gz
    expire_in: 30 days

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  dependencies:
    - package
  script:
    - ./scripts/publish.sh
