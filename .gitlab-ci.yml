stages:
  - fmt
  - clippy
  - test
  - reproduce
  - package
  - release

default:
  tags:
    - rust
    - omaclipsync
  cache:
    key: omaclipsync-rust-x86_64
    paths:
      - target/

variables:
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

fmt:
  stage: fmt
  script:
    - cargo fmt --manifest-path core/Cargo.toml --all -- --check

clippy:
  stage: clippy
  script:
    - cargo clippy --manifest-path core/Cargo.toml --locked --all-targets -- -D warnings

test:
  stage: test
  script:
    - cargo test --manifest-path core/Cargo.toml --locked
    - cargo build --manifest-path core/Cargo.toml --locked --bin syncclipd
    - gjs tests/settings.gjs Settings.js
    - gjs tests/inbox.test.js Inbox.js

reproduce:
  stage: reproduce
  script:
    - ./scripts/reproducible-build.sh
  artifacts:
    paths:
      - dist/native/
      - dist/BUILD-EVIDENCE.txt
    expire_in: 30 days

package:
  stage: package
  script:
    - ./scripts/package.sh --use-verified
    - cd dist && sha256sum omaclipsync-plugin-*.tar.gz syncclipd-linux-x86_64 syncclipctl-linux-x86_64 BUILD-EVIDENCE.txt > SHA256SUMS
  artifacts:
    paths:
      - dist/syncclipd-linux-x86_64
      - dist/syncclipctl-linux-x86_64
      - dist/BUILD-EVIDENCE.txt
      - dist/SHA256SUMS
      - dist/omaclipsync-plugin-*.tar.gz
    expire_in: 30 days

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  dependencies:
    - package
  script:
    - ./scripts/publish.sh
