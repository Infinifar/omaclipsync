name: Rebuild, compare and publish native assets

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH_TEST: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name != 'main' }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Check settings, inbox and configuration-error replies
        run: |
          node tests/settings.test.js
          node tests/inbox.test.js
          node tests/service.test.js
      - name: Rebuild both executables and compare against the committed bytes
        if: env.BRANCH_TEST != 'true'
        shell: bash
        run: ./scripts/reproducible-build.sh
      - name: Build test executables from the selected branch
        if: env.BRANCH_TEST == 'true'
        shell: bash
        run: ./scripts/reproducible-build.sh --update-bundled
      - name: Package the verified source build
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' manifest.json)
          [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == "v$version" ]]
          if [[ "$BRANCH_TEST" == true ]]; then
            ./scripts/package.sh --use-bundled
          else
            ./scripts/package.sh --use-verified
          fi
          (cd dist && sha256sum "omaclipsync-plugin-$version.tar.gz" syncclipd-linux-x86_64 syncclipctl-linux-x86_64 BUILD-EVIDENCE.txt > SHA256SUMS)
      - name: Upload branch test package and build evidence
        if: env.BRANCH_TEST == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omaclipsync-branch-${{ github.sha }}
          path: |
            dist/omaclipsync-plugin-*.tar.gz
            dist/syncclipd-linux-x86_64
            dist/syncclipctl-linux-x86_64
            dist/BUILD-EVIDENCE.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Attach assets to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' manifest.json)
          [[ "$RELEASE_TAG" == "v$version" ]]
          gh release upload "$RELEASE_TAG" "dist/omaclipsync-plugin-$version.tar.gz" dist/syncclipd-linux-x86_64 dist/syncclipctl-linux-x86_64 dist/BUILD-EVIDENCE.txt dist/SHA256SUMS
      - name: Publish the verified tagged build
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' manifest.json)
          [[ "$RELEASE_TAG" == "v$version" ]]
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Omaclipsync $version" --notes-file "releases/$RELEASE_TAG.md" \
            "dist/omaclipsync-plugin-$version.tar.gz" dist/syncclipd-linux-x86_64 \
            dist/syncclipctl-linux-x86_64 dist/BUILD-EVIDENCE.txt dist/SHA256SUMS
          verify="$RUNNER_TEMP/release-asset-check"
          gh release download "$RELEASE_TAG" --dir "$verify"
          cmp dist/SHA256SUMS "$verify/SHA256SUMS"
          (cd "$verify" && sha256sum --check SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --latest
