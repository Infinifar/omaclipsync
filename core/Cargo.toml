[package]
name = "omaclipsync-core"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
rustclipsync-core = { version = "=0.4.0", path = "vendor/rustclipsync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wl-clipboard-rs = "0.9.5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
